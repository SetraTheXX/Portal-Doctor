name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release
      - run: cargo package --locked
      - name: Install binary smoke
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/portaldoctor"
          cargo install --path . --locked --root "$install_root"
          binary="$install_root/bin/portaldoctor"
          expected_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "portaldoctor") | .version')"
          test "$("$binary" --version)" = "portaldoctor $expected_version"

          set +e
          "$binary" --definitely-invalid > /dev/null 2>&1
          usage_status=$?
          set -e
          test "$usage_status" -eq 2

          json_path="$RUNNER_TEMP/portaldoctor.json"
          set +e
          "$binary" --json > "$json_path"
          json_status=$?
          set -e
          case "$json_status" in
            0|3) ;;
            *) echo "unexpected JSON smoke exit: $json_status" >&2; exit 1 ;;
          esac
          jq -e '(.schema_version == 1) and (.portaldoctor_version == $version) and (.findings | type == "array")' --arg version "$expected_version" "$json_path" > /dev/null

          report_path="$RUNNER_TEMP/portaldoctor-report.md"
          set +e
          "$binary" report --format markdown --suppress-hostname > "$report_path"
          report_status=$?
          set -e
          case "$report_status" in
            0|3) ;;
            *) echo "unexpected Markdown smoke exit: $report_status" >&2; exit 1 ;;
          esac
          grep -q '^# PortalDoctor diagnostic report$' "$report_path"
      - name: Install FileChooser fake portal dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y dbus-x11 python3-gi gir1.2-glib-2.0
      - name: FileChooser controlled lifecycle gate
        run: |
          PORTALDOCTOR_BIN=target/release/portaldoctor \
          PORTALDOCTOR_PYTHON=/usr/bin/python3 \
          ./scripts/validate-filechooser-fake-ci.sh
      - name: Screenshot controlled lifecycle gate
        run: |
          PORTALDOCTOR_BIN=target/release/portaldoctor \
          PORTALDOCTOR_PYTHON=/usr/bin/python3 \
          ./scripts/validate-screenshot-fake-ci.sh
      - name: ScreenCast CreateSession controlled lifecycle gate
        run: |
          ./scripts/validate-screencast-create-session-ci.sh
      - name: ScreenCast SelectSources controlled lifecycle gate
        run: |
          ./scripts/validate-screencast-select-sources-ci.sh
      - name: ScreenCast Start controlled lifecycle gate
        run: |
          ./scripts/validate-screencast-start-ci.sh
      - name: ScreenCast StreamsReturned controlled lifecycle gate
        run: |
          ./scripts/validate-screencast-streams-returned-ci.sh
      - name: ScreenCast OpenPipeWireRemote controlled lifecycle gate
        run: |
          ./scripts/validate-screencast-open-pipe-wire-remote-ci.sh
      - name: ScreenCast aggregate controlled lifecycle gate
        run: |
          ./scripts/validate-screencast-aggregate-ci.sh
      - name: KDE isolated D-Bus ownership gate
        run: |
          ./scripts/validate-dbus-kde-ci.sh
      - name: KDE isolated systemd collector gate
        run: |
          ./scripts/validate-systemd-kde-ci.sh
      - name: KDE isolated runtime aggregate gate
        run: |
          ./scripts/validate-kde-runtime-aggregate-ci.sh
      - name: Sway isolated runtime aggregate gate
        run: |
          ./scripts/validate-sway-runtime-aggregate-ci.sh
      - name: Sway activation-environment integration gate
        run: |
          ./scripts/validate-sway-activation-ci.sh
      - run: PORTALDOCTOR_BIN=target/release/portaldoctor python3 scripts/validate-v0.1-faults.py
