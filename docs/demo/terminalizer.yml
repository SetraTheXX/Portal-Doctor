# PortalDoctor README demo configuration.
# Run from the repository root:
#   terminalizer record /tmp/portaldoctor-demo --config docs/demo/terminalizer.yml --skip-sharing
#   terminalizer render /tmp/portaldoctor-demo -o docs/assets/portaldoctor-demo.gif -q 95

command: bash scripts/demo.sh
cwd: .
env:
  recording: true
cols: 112
rows: 30
repeat: -1
quality: 95
frameDelay: auto
maxIdleTime: 5000
frameBox:
  type: floating
  title: null
  style:
    boxShadow: none
    margin: 12px
    backgroundColor: "#1e1e2e"
    borderRadius: 10px
watermark:
  imagePath: null
  style:
    position: absolute
    right: 15px
    bottom: 15px
    width: 100px
    opacity: 0.9
cursorStyle: bar
fontFamily: "DejaVu Sans Mono, Ubuntu Mono, monospace"
fontSize: 16
lineHeight: 1.15
letterSpacing: 0
theme:
  background: "#1e1e2e"
  foreground: "#cdd6f4"
  cursor: "#f5e0e6"
  black: "#45475a"
  red: "#f38ba8"
  green: "#a6e3a1"
  yellow: "#f9e2af"
  blue: "#89b4fa"
  magenta: "#f5c2e7"
  cyan: "#94e2d5"
  white: "#bac2de"
  brightBlack: "#585b70"
  brightRed: "#f38ba8"
  brightGreen: "#a6e3a1"
  brightYellow: "#f9e2af"
  brightBlue: "#89b4fa"
  brightMagenta: "#f5c2e7"
  brightCyan: "#94e2d5"
  brightWhite: "#cdd6f4"
